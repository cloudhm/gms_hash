<!doctype html>
<meta charset="utf-8" />
<title>Script Tag · Webhook 管理</title>
<style>
  body { font-family: sans-serif; max-width: 880px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  input, button, textarea { font: inherit; }
  input[type="password"], input[type="text"] { width: 100%; padding: 6px 8px; box-sizing: border-box; }
  label { display: block; margin: 8px 0 4px; font-size: 13px; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: top; font-size: 13px; word-break: break-all; }
  th { background: #f5f5f5; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .err { color: #b00020; }
  .ok { color: #0a7; }
  .card { border: 1px solid #ddd; padding: 12px 14px; border-radius: 8px; margin: 12px 0; }
  button.danger { color: #b00020; }
  code { font-size: 12px; }
</style>
<h1>Script Tag · Webhook 管理</h1>
<p>用 <code>APP_SECRET</code>（或环境变量 <code>ADMIN_KEY</code>）登录。不会把店铺 TOKEN 下发到浏览器。</p>
<div class="card">
  <label>管理口令</label>
  <input id="key" type="password" autocomplete="off" />
  <div class="row">
    <button type="button" id="btn-login">进入</button>
    <button type="button" id="btn-refresh">刷新全部</button>
  </div>
  <p id="msg"></p>
</div>
<div class="card">
  <h2>Script Tag 注册</h2>
  <label>src</label>
  <input id="src" type="text" />
  <label>display_scope</label>
  <input id="scope" type="text" value="index,collection,product,search,cart" />
  <div class="row">
    <button type="button" id="btn-create">注册 Script Tag</button>
  </div>
</div>
<table>
  <thead>
    <tr><th>id</th><th>src / scope</th><th>操作</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<div class="card">
  <h2>Webhook 注册</h2>
  <p>默认地址为本进程 <code>/webhooks</code>（需 HTTPS 公网，例如 ngrok）。Token 需有 webhook 权限，否则列表会 403。</p>
  <label>address</label>
  <input id="hook-address" type="text" />
  <label>topic</label>
  <input id="hook-topic" type="text" list="hook-topics" placeholder="orders/create" />
  <datalist id="hook-topics">
    <option value="orders/create"></option>
    <option value="orders/cancelled"></option>
    <option value="orders/fulfilled"></option>
    <option value="orders/paid"></option>
    <option value="orders/updated"></option>
    <option value="products/create"></option>
    <option value="products/update"></option>
    <option value="products/delete"></option>
    <option value="app/uninstalled"></option>
  </datalist>
  <div class="row">
    <button type="button" id="btn-hook-create">注册 Webhook</button>
  </div>
</div>
<table>
  <thead>
    <tr><th>id</th><th>address / topic</th><th>操作</th></tr>
  </thead>
  <tbody id="hook-rows"></tbody>
</table>
<script>
  const keyEl = document.getElementById('key');
  const msg = document.getElementById('msg');
  const srcEl = document.getElementById('src');
  const scopeEl = document.getElementById('scope');
  const rows = document.getElementById('rows');
  const addrEl = document.getElementById('hook-address');
  const topicEl = document.getElementById('hook-topic');
  const hookRows = document.getElementById('hook-rows');
  keyEl.value = sessionStorage.getItem('sssAdminKey') || '';

  function setMsg(text, ok) {
    msg.className = ok ? 'ok' : 'err';
    msg.textContent = text || '';
  }

  function headers() {
    return {
      'Content-Type': 'application/json',
      'X-Admin-Key': keyEl.value || '',
    };
  }

  async function api(path, opts) {
    const res = await fetch(path, { ...opts, headers: { ...headers(), ...(opts && opts.headers) } });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || 'HTTP ' + res.status);
    return body;
  }

  async function refreshTags() {
    const data = await api('/admin/api/script-tags');
    srcEl.placeholder = data.defaultSrc || '';
    if (!srcEl.value) srcEl.value = data.defaultSrc || '';
    rows.innerHTML = '';
    (data.tags || []).forEach((t) => {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td><code>' + t.id + '</code></td>' +
        '<td><input data-src style="margin-bottom:6px" /><br><input data-scope /></td>' +
        '<td><button type="button" data-save>更新</button> <button type="button" class="danger" data-del>删除</button></td>';
      tr.querySelector('[data-src]').value = t.src || '';
      tr.querySelector('[data-scope]').value = t.display_scope || '';
      tr.querySelector('[data-save]').onclick = async () => {
        try {
          await api('/admin/api/script-tags/' + encodeURIComponent(t.id), {
            method: 'PUT',
            body: JSON.stringify({
              src: tr.querySelector('[data-src]').value,
              display_scope: tr.querySelector('[data-scope]').value,
            }),
          });
          setMsg('Script Tag 已更新', true);
          refreshTags();
        } catch (e) {
          setMsg(e.message, false);
        }
      };
      tr.querySelector('[data-del]').onclick = async () => {
        if (!confirm('删除这条 Script Tag？店铺将不再注入该脚本。')) return;
        try {
          await api('/admin/api/script-tags/' + encodeURIComponent(t.id), { method: 'DELETE' });
          setMsg('Script Tag 已删除', true);
          refreshTags();
        } catch (e) {
          setMsg(e.message, false);
        }
      };
      rows.appendChild(tr);
    });
    if (!(data.tags || []).length) {
      rows.innerHTML = '<tr><td colspan="3">暂无 Script Tag</td></tr>';
    }
    return (data.tags || []).length;
  }

  async function refreshHooks() {
    const data = await api('/admin/api/webhooks');
    addrEl.placeholder = data.defaultAddress || '';
    if (!addrEl.value) addrEl.value = data.defaultAddress || '';
    hookRows.innerHTML = '';
    (data.webhooks || []).forEach((h) => {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td><code>' + h.id + '</code></td>' +
        '<td><input data-addr style="margin-bottom:6px" /><br><input data-topic /></td>' +
        '<td><button type="button" data-save>更新</button> <button type="button" class="danger" data-del>删除</button></td>';
      tr.querySelector('[data-addr]').value = h.address || '';
      tr.querySelector('[data-topic]').value = h.topic || '';
      tr.querySelector('[data-save]').onclick = async () => {
        try {
          await api('/admin/api/webhooks/' + encodeURIComponent(h.id), {
            method: 'PUT',
            body: JSON.stringify({
              address: tr.querySelector('[data-addr]').value,
              topic: tr.querySelector('[data-topic]').value,
            }),
          });
          setMsg('Webhook 已更新', true);
          refreshHooks();
        } catch (e) {
          setMsg(e.message, false);
        }
      };
      tr.querySelector('[data-del]').onclick = async () => {
        if (!confirm('删除这条 Webhook？平台将不再向该地址推送 ' + (h.topic || '') + '。')) return;
        try {
          await api('/admin/api/webhooks/' + encodeURIComponent(h.id), { method: 'DELETE' });
          setMsg('Webhook 已删除', true);
          refreshHooks();
        } catch (e) {
          setMsg(e.message, false);
        }
      };
      hookRows.appendChild(tr);
    });
    if (!(data.webhooks || []).length) {
      hookRows.innerHTML = '<tr><td colspan="3">暂无 Webhook</td></tr>';
    }
    return (data.webhooks || []).length;
  }

  async function refresh() {
    sessionStorage.setItem('sssAdminKey', keyEl.value || '');
    const nTags = await refreshTags();
    let nHooks = 0;
    try {
      nHooks = await refreshHooks();
    } catch (e) {
      hookRows.innerHTML = '<tr><td colspan="3">' + e.message + '</td></tr>';
      setMsg('Script Tag ' + nTags + ' 条；Webhook：' + e.message, false);
      return;
    }
    setMsg('已加载 Script Tag ' + nTags + ' 条、Webhook ' + nHooks + ' 条', true);
  }

  document.getElementById('btn-login').onclick = () => refresh().catch((e) => setMsg(e.message, false));
  document.getElementById('btn-refresh').onclick = () => refresh().catch((e) => setMsg(e.message, false));
  document.getElementById('btn-create').onclick = async () => {
    try {
      await api('/admin/api/script-tags', {
        method: 'POST',
        body: JSON.stringify({ src: srcEl.value, display_scope: scopeEl.value }),
      });
      setMsg('Script Tag 已注册', true);
      refreshTags();
    } catch (e) {
      setMsg(e.message, false);
    }
  };
  document.getElementById('btn-hook-create').onclick = async () => {
    try {
      await api('/admin/api/webhooks', {
        method: 'POST',
        body: JSON.stringify({ address: addrEl.value, topic: topicEl.value }),
      });
      setMsg('Webhook 已注册', true);
      refreshHooks();
    } catch (e) {
      setMsg(e.message, false);
    }
  };
  if (keyEl.value) refresh().catch((e) => setMsg(e.message, false));
</script>
